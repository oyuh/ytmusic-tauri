[package]
name = "ytmusic"
version = "0.1.7"
description = "YT Music desktop player"
authors = ["Lawson Hart"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8"
tiny_http = "0.12"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
md5 = "0.7"
# Core Audio, to label our audio session in the Volume Mixer. Version matches the one
# wry already pulls in, so this builds no extra crate.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
] }
# The #[implement] macro expands to absolute `windows_core::` paths, so it has to be a
# direct dependency even though `windows` re-exports the same crate as `windows::core`.
windows-core = "0.61"
